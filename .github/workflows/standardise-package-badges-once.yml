name: Standardise package badges once

on:
  push:
    branches:
      - docs/standardise-package-badges

permissions:
  contents: write

jobs:
  standardise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: docs/standardise-package-badges
          fetch-depth: 0

      - name: Standardise README badge block
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packageName = packageJson.name;
          if (typeof packageName !== 'string' || !packageName.startsWith('@plasius/')) {
            throw new Error('Expected a root @plasius package name');
          }

          const [owner, repository] = process.env.REPOSITORY.split('/');
          const source = fs.readFileSync('README.md', 'utf8').replace(/\r\n/g, '\n');
          const lines = source.split('\n');
          const title = lines.shift();
          if (!title?.startsWith('# ')) {
            throw new Error('README must start with a level-one package title');
          }

          let bodyStart = 0;
          while (bodyStart < lines.length) {
            const line = lines[bodyStart].trim();
            if (line === '' || /^\[!\[.+\]\(.+\)\]\(.+\)$/.test(line)) {
              bodyStart += 1;
              continue;
            }
            break;
          }

          const badges = [
            `[![npm version](https://img.shields.io/npm/v/${packageName}.svg)](https://www.npmjs.com/package/${packageName})`,
            `[![Build Status](https://img.shields.io/github/actions/workflow/status/${owner}/${repository}/ci.yml?branch=main&label=build&style=flat)](https://github.com/${owner}/${repository}/actions/workflows/ci.yml)`,
            `[![coverage](https://img.shields.io/codecov/c/github/${owner}/${repository})](https://codecov.io/gh/${owner}/${repository})`,
            `[![License](https://img.shields.io/github/license/${owner}/${repository})](./LICENSE)`,
            '[![Code of Conduct](https://img.shields.io/badge/code%20of%20conduct-yes-blue.svg)](./CODE_OF_CONDUCT.md)',
            '[![Security Policy](https://img.shields.io/badge/security%20policy-yes-orange.svg)](./SECURITY.md)',
            '[![Changelog](https://img.shields.io/badge/changelog-md-blue.svg)](./CHANGELOG.md)',
          ];

          const body = lines.slice(bodyStart).join('\n').replace(/^\n+/, '');
          const output = `${title}\n\n${badges.join('\n')}\n\n${body}`;
          fs.writeFileSync('README.md', output.endsWith('\n') ? output : `${output}\n`);
          NODE

      - name: Commit README-only result
        run: |
          set -euo pipefail
          rm .github/workflows/standardise-package-badges-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/standardise-package-badges-once.yml
          git commit -m "docs: standardise package status badges"
          git push origin HEAD:docs/standardise-package-badges
